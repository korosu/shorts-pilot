# ============================================================
# shorts-pilot configuration
# API keys and model go in .env — not here.
#
# Copy this file to config.yaml and edit to your needs.
# config.yaml is gitignored so your changes won't be overwritten by git pull.
# ============================================================

telegram_prefix: "shorts-pilot"

generation:
  # How many new jobs to generate per refill call
  count: 21

  # Refill triggers when pending jobs drop below this number.
  # "Pending" = enabled in yaml AND not yet generated (not in seen.txt)
  threshold: 10

# Where jobs.yaml / jobs_<suffix>.yaml and seen_<suffix>.txt files live.
# Lets you run `refill` / `init-seen` without passing --jobs-dir / --seen-dir
# every time. Explicit CLI flags always override these.
# Relative paths are resolved against this config.yaml's location.
# Leave the whole section out (or set to null) to keep using
# --jobs-dir / the current directory, like before.
#
# paths:
#   jobs_dir: /your/path/to/jobs
#   seen_dir: /your/path/to/seen   # optional, defaults to jobs_dir if omitted

# Directories to scan when running init_seen.py (or `init-seen` if installed via uv).
# These are scanned for existing .mp4 files to populate seen.txt (or seen_<suffix>.txt).
# Add as many paths as you need. Leave empty to always pass --dir at runtime instead.
# Example:
# scan_dirs: [/path/one, /path/two]
#
scan_dirs: []

# Language profiles — add or edit freely.
# file_suffix determines jobs filename: "" → jobs.yaml, "_es" → jobs_es.yaml, etc.
langs:
  en:
    label: English
    file_suffix: ""
    voice_rate_min: 1.05
    voice_rate_max: 1.20
    voices:
      - gemini:aoede
      - gemini:charon
      - gemini:fenrir
      - gemini:kore
      - gemini:leda
      - gemini:orus
      - gemini:puck
      - gemini:zephyr
    # Themes for this language's theme mode. When non-empty, `refill` generates
    # short topic titles constrained to these themes. Omit for free-topic LLM.
    # theme_list:
    #   - job
    #   - animal
    #   - computer

    # These values are written into every generated job entry
    job_defaults:
      video_clip_duration: 3
      video_concat_mode: random
      bgm_type: random
      bgm_volume: 0.15
      paragraph_number: 2
      # Target narration duration in seconds (optional). Omit for no limit (current behavior).
      # Format: "min-max" in seconds, or "min+" for open-ended upper bound.
      # Recommended presets: "30-60", "60-90", "90-120", "120+". Custom ranges OK.
      # Converted to word bounds (2.39 words/sec) and injected into video_script_prompt;
      # paragraph_number is nudged upward (max(config, band)) but never downward.
      # duration_range: "30-60"

  es:
    label: Spanish
    file_suffix: "_es"  # → jobs_es.yaml + seen_es.txt
    voice_rate_min: 1.05
    voice_rate_max: 1.15
    voices:
      - gemini:aoede
      - gemini:charon
      - gemini:fenrir
      - gemini:kore
      - gemini:leda
      - gemini:orus
      - gemini:puck
      - gemini:zephyr

    job_defaults:
      video_clip_duration: 4
      video_concat_mode: random
      bgm_type: random
      bgm_volume: 0.15
      paragraph_number: 2
      # Target narration duration in seconds (optional). Omit for no limit (current behavior).
      # Format: "min-max" in seconds, or "min+" for open-ended upper bound.
      # Recommended presets: "30-60", "60-90", "90-120", "120+". Custom ranges OK.
      # Converted to word bounds (2.39 words/sec) and injected into video_script_prompt;
      # paragraph_number is nudged upward (max(config, band)) but never downward.
      # duration_range: "60-90"
