[project]
name = "shorts-pilot"
version = "1.1.0"
description = "Auto-generate YouTube/TikTok/Instagram shorts video ideas and refill your MoneyPrinterTurbo jobs queue via LLM"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
refill = "shorts_pilot.refill:main"
init-seen = "shorts_pilot.init_seen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_pilot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/shorts_pilot/generator/prompt.py" = ["E501"]
"tests/test_count.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[project.urls]
Repository = "https://github.com/korosu/shorts-pilot"
Issues = "https://github.com/korosu/shorts-pilot/issues"

[project.optional-dependencies]
dev = ["ruff>=0.15.20", "pytest>=8.0", "pyright>=1.1"]

[dependency-groups]
dev = ["ruff>=0.15.20", "pytest>=8.0", "pyright>=1.1"]
